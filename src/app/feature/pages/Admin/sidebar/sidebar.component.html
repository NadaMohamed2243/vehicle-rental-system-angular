<!-- Sidebar Container -->
<div
  class="fixed top-0 left-0 h-screen bg-white shadow-md flex flex-col py-4 rounded-r-2xl z-40 transition-all duration-300"
  [ngClass]="{ 'w-56': sidebarVisible, 'w-14': !sidebarVisible }"
  (mouseenter)="hovered = true"
  (mouseleave)="hovered = false"
>

  <!-- Logo + Toggle Zone -->
  <div class="flex items-center justify-between px-3">
    <div class="flex items-center space-x-2 h-10">

      <!-- if sidebar was opened-->
      <ng-container *ngIf="sidebarVisible">
        <img src="/images/logo2.png" class="h-8 w-8" />
        <span class="font-semibold text-lg">Meshwark</span>
      </ng-container>

      <!-- if sidebar was closed-->
      <ng-container *ngIf="!sidebarVisible">
        <ng-container *ngIf="!hovered">
          <img src="/images/logo2.png" class="h-8 w-8 mx-auto" />
        </ng-container>

        <ng-container *ngIf="hovered">
          <button (click)="toggleSidebar()" class="p-1 rounded hover:bg-gray-100">
            <i class="pi pi-bars text-xl text-gray-700"></i>
          </button>
        </ng-container>
      </ng-container>
    </div>

    <!-- close button-->
    <button *ngIf="sidebarVisible" (click)="toggleSidebar()" class="text-gray-400 hover:text-red-500">
      <i class="pi pi-times text-xl"></i>
    </button>
  </div>

  <!-- Navigation Links -->
  <nav class="flex flex-col gap-3 mt-8 px-2">
    <!-- overview -->
    <a
      routerLink="overview"
      routerLinkActive="bg-blue-100 text-blue-600 font-semibold"
      class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-600 hover:bg-blue-50   transition"
      [ngClass]="{ 'justify-center': !sidebarVisible }"
    >
      <i class="pi pi-th-large text-xl"></i>
      <span *ngIf="sidebarVisible">Overview</span>
    </a>

     <!-- Bookings -->
  <a
    routerLink="booking"
    routerLinkActive="bg-blue-100 text-blue-600 font-semibold"
    class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-600 hover:bg-blue-50 transition"
    [ngClass]="{ 'justify-center': !sidebarVisible }"
  >
    <i class="pi pi-calendar-clock text-xl"></i>
    <span *ngIf="sidebarVisible">Bookings</span>
  </a>

  <!-- Users -->
  <a
    routerLink="accept-user"
    routerLinkActive="bg-blue-100 text-blue-600 font-semibold"
    class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-600 hover:bg-blue-50 transition"
    [ngClass]="{ 'justify-center': !sidebarVisible }"
  >
    <i class="pi pi-users text-xl"></i>
    <span *ngIf="sidebarVisible">Customers</span>
  </a>

  <!-- Agents -->
  <a
    routerLink="accept-agent"
    routerLinkActive="bg-blue-100 text-blue-600 font-semibold"
    class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-600 hover:bg-blue-50 transition"
    [ngClass]="{ 'justify-center': !sidebarVisible }"
  >
    <i class="pi pi-building text-xl"></i>
    <span *ngIf="sidebarVisible">Car provider</span>
  </a>

  <!-- Cars -->
  <a
    routerLink="cars-list"
    routerLinkActive="bg-blue-100 text-blue-600 font-semibold"
    class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-600 hover:bg-blue-50 transition"
    [ngClass]="{ 'justify-center': !sidebarVisible }"
  >
    <i class="pi pi-car text-xl"></i>
    <span *ngIf="sidebarVisible">Cars</span>
  </a>
  </nav>

  <!-- Logout -->
  <div class="mt-auto px-2 ">
    <a
    (click)="logout()"
      class="flex items-center gap-3 p-2 rounded-lg text-gray-600 hover:text-red-500 cursor-pointer"
      [ngClass]="{ 'justify-center': !sidebarVisible }"
    >
      <i class="pi pi-sign-out text-xl"></i>
      <span *ngIf="sidebarVisible">Logout</span>
    </a>
  </div>
</div>
