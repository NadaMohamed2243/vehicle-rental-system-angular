<div class="flex justify-between items-center px-4 py-2 bg-transparent">
 

  <!-- RIGHT: User Info -->
  <div class="flex items-center">
     <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" [style]="{ width: '40px', height: '40px' }" />
     

    <div class="ml-2">
      <h2 class="text-sm font-medium text-gray-800">{{ user.name }}</h2>
      <p class="text-xs text-gray-500 capitalize">
        {{ user.role === 'agent' ? 'Car Provider' : user.role }}
      </p>
    </div>
  </div>
</div>
