<section
  class="relative w-full h-min-[70vh] flex items-center justify-center px-4 overflow-hidden p-8"
>
  <!-- Background Image with Blur -->
 <div
    class="absolute inset-0 bg-center bg-cover bg-no-repeat z-0"
    style="background-image: url('/images/heroBackground.jpg'); filter: blur(6px); transform: scale(1.1);"
  ></div>


  <!-- Foreground Content -->
  <div class="relative z-10 w-full max-w-4xl bg-white/90 backdrop-blur-lg rounded-xl shadow-2xl p-8 animate-fade-in">
    <h1 class="text-4xl font-bold text-center text-[var(--color-dark-blue)] mb-6">
      Rent the Perfect Car for Your Journey
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <!-- Location Input -->
      <div class="relative">
        <label for="location" class="block text-sm font-medium text-gray-700 mb-1">Location</label>
        <div class="relative">
          <input
            type="text"
            id="location"
            placeholder="Enter city or airport"
            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          />
          <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Pickup Date -->
      <div>
        <label for="pickup-date" class="block text-sm font-medium text-gray-700 mb-1">Pickup Date</label>
        <input
          type="date"
          id="pickup-date"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>

      <!-- Return Date -->
      <div>
        <label for="return-date" class="block text-sm font-medium text-gray-700 mb-1">Return Date</label>
        <input
          type="date"
          id="return-date"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>

      <!-- Search Button -->
      <div class="flex items-end">
        <button
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200 shadow-md transform hover:scale-105"
        >
          FIND CAR
        </button>
      </div>
    </div>
  </div>
</section>
